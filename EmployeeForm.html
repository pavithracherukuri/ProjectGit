<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Employee Details</h2>
    Name:<input type="text" placeholder="Enter Your Name">
    <br><br>
    Email:<input type="email" placeholder="Enter Your Email">
    <br><br>
    Phone No:<input type="number" placeholder="Enter Your Number">
    <br><br>

    Gender:
    <input type="radio" name="G" id="g1"><label for="g1">Male</label>
    <input type="radio" name="G" id="g2"><label for="g2">Female</label>
    
    <br><br>
    Job Role:
    <select>
        <option value="">Select</option>
        <option value="">Frontend</option>
        <option value="">Backend</option>
        <option value="">Fullstack</option>
    </select>
    <br><br>
    Skills:
    <input type="checkbox">Html
    <input type="checkbox">Css
    <input type="checkbox">Java Script
    <input type="checkbox">Java
    <br><br>
    Salary:<input type="range" min="10000" max="100000">
    <br><br>
    <textarea rows="3" cols="30" placeholder="Comments"></textarea>
    <br><br>
    <input type="submit">
    

</body>
</html>
